services:
  - type: web
    name: maison-yvonne
    runtime: docker
    plan: free
    region: frankfurt
    envVars:
      - key: SPRING_MONGODB_URI
        sync: false # secret: Render asks for it on first deploy
      - key: SPRING_MONGODB_DATABASE
        value: maisonyvonne
      - key: SERVER_SERVLET_SESSION_COOKIE_SECURE
        value: "true"
      # first admin, created once on an empty database; change the password in the app afterwards
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
